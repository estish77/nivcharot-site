name: Check Search Console connection

# Manual-only connectivity check for the Search Console service account
# (2026-09-23 setup — see src/lib/searchConsole.ts). Deliberately not on a
# schedule: this exists to verify the GOOGLE_SEARCH_CONSOLE_CREDENTIALS
# secret works, run by hand from the Actions tab (or `gh workflow run`)
# whenever that's in question, not as a standing job.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Query Search Console
        env:
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
        run: node scripts/check-search-console.mjs
