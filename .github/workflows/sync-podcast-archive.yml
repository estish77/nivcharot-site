name: Sync podcast archive

# Weekly refresh of the "חרדית מדוברת" podcast catalogue (2026-09-09 brief:
# "תעשה את זה פעם בשבוע שיהיה לך קבוע" — do this weekly, make it a standing
# thing). Walks the YouTube channel for new episodes/Shorts and commits the
# result straight to main, which Vercel then deploys automatically — same
# effect as running `npm run sync-podcast-archive` by hand (see that script
# and src/lib/youtubeChannel.ts for how/why), just on its own schedule
# instead of someone remembering to run it.
#
# Needs no real Payload/DB credentials: this script never calls Payload's
# local API, only `payload run` to execute it — a placeholder sqlite path
# and secret are enough for that command to boot.
on:
  schedule:
    # 06:17 UTC every Sunday. Off the hour on purpose (not 06:00) so this
    # doesn't land in the exact same instant every other "every Sunday at
    # 6am" cron job on GitHub's shared runners does.
    - cron: '17 6 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Sync podcast archive from YouTube
        env:
          DATABASE_URI: file:./ci-sync.db
          PAYLOAD_SECRET: ci-sync-placeholder-secret
        run: npm run sync-podcast-archive

      - name: Commit and push if the archive changed
        run: |
          if git diff --quiet -- src/content/podcast-archive.json; then
            echo "No changes — channel has nothing new since the last sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/podcast-archive.json
          git commit -m "Weekly podcast archive sync"
          git push
